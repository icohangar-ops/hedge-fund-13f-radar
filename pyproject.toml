[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hedge-fund-13f-radar"
version = "0.1.0"
description = "13F conviction, initiation, exit, and sector-rotation radar with CHP-style verification."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cubiczan" }]
dependencies = []

[project.scripts]
hedge-fund-13f-radar = "hedge_fund_13f_radar.cli:main"

[tool.maturin]
python-source = "src"
module-name = "hedge_fund_13f_radar._native"
# Compile the Rust engine's pyo3 bindings (opt-in feature in Cargo.toml).
features = ["python"]
