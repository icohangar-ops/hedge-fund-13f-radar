# Evidence matrix — hedge-fund-13f-radar (schema v1, spec art_6m9smoMm)
#
# Every capability claim stated in README.md is bound here to deterministic
# evidence. The fail-closed verifier (tools/verify_evidence_matrix.py, vendored
# byte-identical from the canonical kit icohangar-ops/consensus-hardening-protocol,
# EVIDENCE_MATRIX_VERIFIER_VERSION 1.0.0, vendored from kit commit 88067e4)
# re-executes every row on every CI run; there is no invocation of it that
# passes an unverified repo.
#
# Evidence vocabulary (closed set, schema v1): test | script | manifest_field |
# artifact_hash. pytest node ids are checked statically here and executed by the
# repo's normal CI test jobs (`test` in .github/workflows/ci.yml; the
# `native-bindings` job runs `cargo test --locked` and pytest against the built
# bindings, which is what executes cargo-test: rows and the native-surface rows).
schema_version: 1
repo: hedge-fund-13f-radar
claims:
  - id: C001
    claim: >-
      Repeatable open-source workflow for tracking hedge fund conviction,
      initiations, exits, and sector rotation from normalized 13F data.
    source: "README.md"
    evidence:
      - type: test
        ref: "tests/test_13f_radar.py::test_13f_radar_detects_initiations_and_consensus"
      - type: test
        ref: "cargo-test:pipeline"
      - type: test
        ref: "cargo-test:diff"
  - id: C002
    claim: >-
      The Quick Start command (PYTHONPATH=src python3 -m
      hedge_fund_13f_radar.cli analyze --holdings examples/holdings_13f.csv
      --json) runs the analysis and prints the report as JSON.
    source: "README.md#quick-start"
    evidence:
      - type: test
        ref: "tests/test_cli.py::test_quick_start_analyze_json"
      - type: artifact_hash
        ref: "examples/holdings_13f.csv"
        sha256: "685b8dd2b8c0153a78addb59aa552ff854e7be4e73a0fd1df58317cb1da9fdca"
  - id: C003
    claim: "Manager-level top positions (per-manager signals ranked by conviction and weight)."
    source: "README.md#what-it-produces"
    evidence:
      - type: test
        ref: "tests/test_basic.py::test_radar_report_to_markdown"
      - type: test
        ref: "tests/test_native_engine.py::test_full_pipeline_multi_manager"
      - type: test
        ref: "cargo-test:pipeline"
  - id: C004
    claim: "Initiation, exit, increase, and decrease detection."
    source: "README.md#what-it-produces"
    evidence:
      - type: test
        ref: "cargo-test:diff"
      - type: test
        ref: "tests/test_native_engine.py::test_diff_filings"
      - type: test
        ref: "tests/test_13f_radar.py::test_13f_radar_detects_initiations_and_consensus"
  - id: C005
    claim: "Cross-fund consensus tickers (tickers held by two or more managers)."
    source: "README.md#what-it-produces"
    evidence:
